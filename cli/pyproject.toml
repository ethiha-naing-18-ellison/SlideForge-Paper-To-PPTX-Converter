[tool.poetry]
name = "slideforge-cli"
version = "0.1.0"
description = "SlideForge CLI - Paper-to-PPTX Converter"
authors = ["SlideForge Team"]
packages = [{include = "paperslide"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.9.0"}
rich = "^13.7.0"
pymupdf = "^1.23.8"
pdfminer-six = "^20221105"
python-pptx = "^0.6.23"
sumy = "^0.11.0"
structlog = "^23.2.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.10.1"
fastapi = "^0.104.1"
python-multipart = "^0.0.6"

[tool.poetry.scripts]
slideforge = "paperslide.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
